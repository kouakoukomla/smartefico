<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Image de partage — SmartEfico</title>
<!-- Source de l'image de partage du site (og:image, twitter:image), 1200 x 630,
     refaite le 19 septembre 2026 à la demande du propriétaire : l'ancienne
     (assets/og-cover.jpg, du 12 septembre) montrait le portrait noir et blanc
     et ne mettait en grand que la moitié « leads qualifiés » du titre.
     Passée au fond blanc le même jour, avec le site, puis au noir profond le
     20 septembre, avec lui encore (la version du noir pur reste en
     assets/og-smartefico.jpg : des partages déjà faits y pointent).
     Le 23 septembre, elle reprend le portrait noir et blanc de la signature
     et perd son filet jaune, à la demande du propriétaire. Elle garde en
     revanche son fond noir : il n'a pas demandé qu'elle suive le fond blanc
     du site, et une carte sombre se détache mieux dans un fil de LinkedIn.
     Ce fichier n'est pas une page du site : scripts/build-partage.mjs le
     photographie dans Chrome sans fenêtre et écrit assets/og-smartefico-nb.jpg.
     Le titre est celui de l'accueil, mot pour mot ; le portrait est celui de
     la signature ; « PME, ETI, grands comptes et dirigeants » et le numéro
     viennent de l'ancienne image. Changer le nom du fichier à chaque refonte :
     LinkedIn, Facebook et WhatsApp gardent une image en mémoire par adresse. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&amp;display=block">
<style>
/* Fond noir profond #050507, texte blanc, et le jaune sur ce que l'image a
   de plus important : le nom de la marque, les mots accentués du titre (en
   Instrument Serif italique) et la pastille du numéro, qui tient lieu de
   bouton. Le filet qui séparait le texte du portrait est parti le
   23 septembre 2026 ; le jaune y paraît donc trois fois et non quatre. La
   ligne d'audience reste blanche : c'est du texte courant. */
html,body{margin:0;background:#050507}
.carte{position:relative;width:1200px;height:630px;overflow:hidden;color:#F5F5F3;
  background:radial-gradient(52rem 34rem at 30% -6rem,#14141C,transparent 70%) #050507;
  font-family:"Helvetica Now Text","Helvetica Neue",Helvetica,Arial,sans-serif}
/* Le portrait noir et blanc (900 x 1200) a presque exactement les
   proportions du panneau (470 x 630) : `cover` ne rogne que deux pixels de
   large, et la photo paraît entière, du haut du crâne aux bras croisés. Le
   point de mire n'a donc plus rien à corriger. */
.photo{position:absolute;top:0;right:0;width:470px;height:630px;
  background:url("../../assets/Portrait3.jpg") 50% 50%/cover no-repeat}
/* Plus de filet entre le texte et la photo, retiré le 23 septembre 2026 à la
   demande du propriétaire (« Enlève le cadre jaune de l'image »). Il avait
   été posé en jaune le 21 parce qu'en gris on ne le voyait pas ; le fond
   gris clair du portrait noir et blanc tranche seul sur le noir de la carte,
   et l'arête se voit sans qu'on la dessine. */
.texte{position:absolute;left:64px;top:0;bottom:0;width:630px;display:flex;flex-direction:column;
  justify-content:center}
.marque{display:flex;align-items:center;gap:16px;margin-bottom:30px}
.marque img{width:78px;height:78px;display:block}
.marque span{color:#FFCC00;font-weight:700;font-size:19px;letter-spacing:.14em}
h1{margin:0;font-weight:800;font-size:54px;line-height:1.05;letter-spacing:-.032em}
h1 em{font-family:"Instrument Serif","Times New Roman",Georgia,serif;font-style:italic;
  font-weight:400;color:#FFCC00;letter-spacing:-.005em;font-size:1.12em;padding-right:.04em}
p{margin:0}
.cible{margin-top:30px;font-size:27px;font-weight:600}
.tel{align-self:flex-start;margin-top:14px;padding:9px 22px 10px;border-radius:999px;
  background:#FFCC00;color:#141414;font-size:25px;font-weight:700;letter-spacing:.01em}
</style>
</head>
<body>
<div class="carte">
  <div class="photo"></div>
  <div class="texte">
    <div class="marque"><img src="../../assets/logo-clair.png" alt=""><span>SMARTEFICO</span></div>
    <h1>Générez des <em>leads&nbsp;qualifiés</em> pour vos offres et mettez l’<em>IA&nbsp;générative</em> au service de votre performance.</h1>
    <p class="cible">PME, ETI, grands comptes et dirigeants.</p>
    <p class="tel">+33 7 51 59 96 36</p>
  </div>
</div>
</body>
</html>
