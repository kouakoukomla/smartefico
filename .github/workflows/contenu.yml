name: Régénérer le site après édition du contenu

# Se déclenche quand le back office (Pages CMS) enregistre un article, une
# question de la FAQ ou un visuel, c'est-à-dire quand un fichier de content/ (ou un script/config) change
# sur main. Ne se déclenche PAS sur les fichiers HTML régénérés : pas de boucle.
on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'assets/**'
      - '.pages.yml'
      - 'scripts/sync-content.mjs'
      - 'scripts/build-blog.mjs'
      - 'scripts/optimize-images.mjs'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: regeneration-contenu
  cancel-in-progress: false

jobs:
  regenerer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 24 et non 20 : Node 20 n'est plus maintenu depuis avril 2026, et sharp
      # 0.35 en demande au moins 20.9.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # « npm ci » est reproductible, mais le lockfile peut avoir été généré sous
      # Windows : sharp a des binaires par plateforme, d'où le repli sur install.
      - name: Installer les dépendances (marked, sharp)
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      # Compresse les images trop lourdes uploadées via le back office.
      # Les noms de fichiers sont conservés : les références restent valides.
      - name: Optimiser les images de assets/
        run: node scripts/optimize-images.mjs

      - name: Régénérer les zones du back office dans index.html
        run: node scripts/sync-content.mjs

      - name: Générer le blog (blog.html + pages d'articles)
        run: node scripts/build-blog.mjs

      # index-autonome.html reste volontairement hors dépôt (local).
      - name: Publier les fichiers régénérés
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Rien à régénérer."
          else
            git commit -m "Auto : régénération du site après édition du contenu"
            git push
          fi
