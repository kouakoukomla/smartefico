name: Régénérer le site après édition du contenu

# Se déclenche quand le back office (Pages CMS) enregistre une masterclass ou un
# article, c'est-à-dire quand un fichier de content/ (ou un script/config) change
# sur main. Ne se déclenche PAS sur les fichiers HTML régénérés : pas de boucle.
on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - '.pages.yml'
      - 'scripts/sync-content.mjs'
      - 'scripts/build-blog.mjs'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: regeneration-contenu
  cancel-in-progress: false

jobs:
  regenerer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer les dépendances (marked)
        run: npm ci

      - name: Régénérer la section Masterclass dans index.html
        run: node scripts/sync-content.mjs

      - name: Générer le blog (blog.html + pages d'articles)
        run: node scripts/build-blog.mjs

      # index-autonome.html reste volontairement hors dépôt (local).
      - name: Publier les fichiers régénérés
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Rien à régénérer."
          else
            git commit -m "Auto : régénération du site après édition du contenu"
            git push
          fi
