# Configuration du back office Pages CMS (https://pagescms.org)
# Connecte-toi sur https://app.pagescms.org avec ton compte GitHub, choisis le
# dépôt kouakoukomla/smartefico : ce fichier décrit les formulaires du back office.

media:
  input: assets
  output: assets

content:
  - name: articles
    label: Articles (blog)
    icon: file-text
    type: collection
    path: content/articles
    view:
      fields:
        - title
        - date
        - published
    fields:
      - name: title
        label: Titre
        type: string
        required: true
      - name: date
        label: Date de publication
        type: date
        options:
          format: yyyy-MM-dd
      - name: cover
        label: Image de couverture
        type: image
        description: "Optionnelle. Affichée en haut de l'article et sur la vignette."
      - name: cover_position
        label: Cadrage de la vignette
        type: text
        description: "Où se trouve le sujet dans la hauteur de l'image, en pourcentage. La vignette n'en montre qu'une bande large : 12% si le visage est tout en haut, 50% s'il est au milieu, 70% s'il est bas. Laissez vide pour garder le réglage par défaut (12%)."
      - name: excerpt
        label: Résumé (accroche)
        type: text
        description: "1 à 2 phrases, affichées sur la vignette du blog."
      - name: tally_url
        label: Formulaire d'inscription (Tally)
        type: string
        description: "Optionnel. Collez le lien du formulaire, ex. https://tally.so/r/BzJr5Q : il sera incrusté à la fin de l'article."
      - name: published
        label: Publié sur le site
        type: boolean
        default: true
      - name: body
        label: Contenu de l'article
        type: rich-text

  - name: faq
    label: FAQ (questions fréquentes)
    icon: help-circle
    type: collection
    path: content/faq
    view:
      fields:
        - question
        - order
        - published
    fields:
      - name: question
        label: Question
        type: string
        required: true
      - name: order
        label: Ordre d'affichage
        type: number
        default: 1
      - name: published
        label: Affichée sur le site
        type: boolean
        default: true
      - name: body
        label: Réponse
        type: text

  - name: accueil
    label: Page d'accueil (accroche)
    icon: home
    type: file
    path: content/pages/accueil.md
    fields:
      - name: hero_title
        label: Grande accroche (titre)
        type: text
        description: "Mettez un mot *entre astérisques* pour l'afficher en jaune italique."
      - name: hero_subtitle
        label: Sous-titre
        type: text

  - name: visuels
    label: Visuels du site
    icon: image
    type: file
    path: content/pages/visuels.md
    fields:
      - name: logo
        label: Logo
        type: image
        description: "Utilisé dans le menu et dans le pied de page."
      - name: og_image
        label: Image de partage
        type: image
        description: "Aperçu affiché quand le lien du site est partagé (LinkedIn, WhatsApp…). Idéalement 1200 x 630 px."
