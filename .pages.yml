# Configuration du back office Pages CMS (https://pagescms.org)
# Connecte-toi sur https://app.pagescms.org avec ton compte GitHub, choisis le
# dépôt kouakoukomla/smartefico : ce fichier décrit les formulaires du back office.

media:
  input: assets
  output: assets

content:
  - name: masterclasses
    label: Masterclass
    icon: calendar
    type: collection
    path: content/masterclasses
    view:
      fields:
        - title
        - date_label
        - published
    fields:
      - name: title
        label: Titre
        type: string
        required: true
      - name: date_label
        label: Date (texte affiché)
        type: string
        description: "Ex. : Samedi 3 octobre 2026 · 19h00 GMT · 3h · en ligne"
      - name: poster
        label: Affiche
        type: image
        description: "Image de l'affiche (rangée dans assets/)."
      - name: tally_url
        label: Lien d'inscription
        type: string
        description: "Lien du formulaire Tally, ex. https://tally.so/r/BzJr5Q"
      - name: published
        label: Publiée sur le site
        type: boolean
        default: true
      - name: order
        label: Ordre d'affichage
        type: number
        default: 1
      - name: body
        label: Description
        type: text

  - name: articles
    label: Articles (blog)
    icon: file-text
    type: collection
    path: content/articles
    view:
      fields:
        - title
        - date
        - published
    fields:
      - name: title
        label: Titre
        type: string
        required: true
      - name: date
        label: Date de publication
        type: date
        options:
          format: yyyy-MM-dd
      - name: cover
        label: Image de couverture
        type: image
        description: "Optionnelle. Affichée en haut de l'article et sur la vignette."
      - name: excerpt
        label: Résumé (accroche)
        type: text
        description: "1 à 2 phrases, affichées sur la vignette du blog."
      - name: published
        label: Publié sur le site
        type: boolean
        default: true
      - name: body
        label: Contenu de l'article
        type: rich-text

  - name: faq
    label: FAQ (questions fréquentes)
    icon: help-circle
    type: collection
    path: content/faq
    view:
      fields:
        - question
        - order
        - published
    fields:
      - name: question
        label: Question
        type: string
        required: true
      - name: order
        label: Ordre d'affichage
        type: number
        default: 1
      - name: published
        label: Affichée sur le site
        type: boolean
        default: true
      - name: body
        label: Réponse
        type: text

  - name: accueil
    label: Page d'accueil (accroche)
    icon: home
    type: file
    path: content/pages/accueil.md
    fields:
      - name: hero_title
        label: Grande accroche (titre)
        type: text
        description: "Mettez un mot *entre astérisques* pour l'afficher en jaune italique."
      - name: hero_subtitle
        label: Sous-titre
        type: text
